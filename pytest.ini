[pytest]
# Configuración de pytest para Brasaland Digital

# Rutas de discovery
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    unit: Tests unitarios aislados
    integration: Tests de integración
    slow: Tests lentos (>1s)
    pipeline: Tests de pipelines de datos

# Configuración de cobertura (opcional)
# addopts = --cov=data/pipelines --cov-report=html --cov-report=term
